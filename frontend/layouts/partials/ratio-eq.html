{{- /* The estimate's formula as a display equation on its own line, like LaTeX's equation environment. */ -}}
<div class="eq" role="math" aria-label="{{ T "eq_lhs" }} = ({{ T "eq_num" }}) / ({{ T "eq_den" }})">
	<span>{{ T "eq_lhs" }} =</span>
	<span class="frac"><span>{{ T "eq_num" }}</span><span>{{ T "eq_den" }}</span></span>
</div>
{{- /**/ -}}
