{{- /* An accepted-papers cell. Context: a map with "official" and "own_page".
       Papers known only from a personal page are shown apart, as +N, because they are unofficial. */ -}}
<td{{ if and (eq (int .official) 0) (eq (int .own_page) 0) }} class="zero"{{ end }}>{{ .official }}{{ if gt (int .own_page) 0 }} <span class="own" title="{{ .own_page }} more from personal pages, not in the official list yet">+{{ .own_page }}</span>{{ end }}</td>
