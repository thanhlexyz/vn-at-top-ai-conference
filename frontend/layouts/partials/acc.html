{{- $cls := slice }}{{ with .cls }}{{ $cls = $cls | append . }}{{ end }}
{{- if and (eq (int .official) 0) (eq (int .own_page) 0) }}{{ $cls = $cls | append "zero" }}{{ end -}}
<td{{ with $cls }} class="{{ delimit . " " }}"{{ end }}>{{ .official }}{{ if gt (int .own_page) 0 }} <span class="own" title="{{ T "own_page_more" (dict "Count" .own_page) }}">+{{ .own_page }}</span>{{ end }}</td>
