# Laid over hugo.toml by `make publish`: hugo --config hugo.toml,publish.toml
# GitHub Pages serves a project site under the repository name.
baseURL = 'https://thanhlexyz.github.io/vn-at-top-ai-conference/'

[params]
  # lets search engines index the public site
  local = false
  # the public site lists the titles of rejected and withdrawn papers; false shows the counts only
  showNonAcceptedTitles = true
  # visitor counts with GoatCounter (no cookies, no personal data): the account code, e.g. "vn-at-top-ai" for
  # https://vn-at-top-ai.goatcounter.com; empty means no analytics
  goatcounter = 'thanhlexyz'
  # Google Search Console ownership check
  googleSiteVerification = 'ZF2zUtE9LsOWiwg3KrNvNiRSP0EQ4ULBMv6SMDXSTQQ'
