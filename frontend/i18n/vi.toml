# ---------------------------------------------------------------- front page
[home_title]
other = "Bài báo tại các hội nghị AI hàng đầu của giảng viên ở Việt Nam, {{ .First }}&ndash;{{ .Last }}"
[home_flag_incomplete]
other = "Một số hồ sơ hiện chưa đầy đủ hoặc đang chờ xác nhận. Các giảng viên này được đánh dấu * và trang của từng giảng viên có ghi rõ những thông tin còn thiếu."
[home_flag_pending]
other = "Hiện có {{ .Count }} trường hợp trùng tên chưa được xác nhận, xin xem tại trang <a href=\"{{ .URL }}\">Ứng viên</a>."
[home_note_table]
other = """Số bài bị từ chối bao gồm các bài bị từ chối sau phản biện, bài rút và bài bị loại sơ bộ. Số liệu theo từng hội nghị có ở trang của từng giảng viên và trang Giảng viên.
Tổng số bài bị từ chối được tính bằng toàn bộ số bài bị từ chối tại ICLR cộng với các bài bị từ chối mà tác giả tự công khai tại hội nghị khác (một số bài tại NeurIPS); do đó, đây là con số tối thiểu.
Tổng số bài bị từ chối ước tính (màu cam) bổ sung phần ước tính cho các hội nghị không công khai bài bị từ chối, dựa trên kết quả ICLR của chính giảng viên, theo công thức: số lần nộp cho mỗi bài được chấp nhận = (số bài nộp ICLR + 1) / (số bài được nhận tại ICLR + 1). Đây là số liệu ước tính, không phải số liệu thống kê trực tiếp.
Dấu &ndash; cho biết hồ sơ OpenReview của giảng viên chưa được thu thập.
Số liệu chỉ bao gồm nhánh chính (main track); không tính workshop, bài position và nhánh Datasets &amp; Benchmarks của NeurIPS. Bài được xếp vào Findings được tính là bị từ chối và là bài workshop.
Danh sách giảng viên được sắp xếp theo tổng số bài được chấp nhận."""
[home_note_provisional]
other = """Danh sách chính thức của {{ .Name }} {{ .Year }} được công bố trước khi hội nghị diễn ra và hiện chưa đầy đủ.
Riêng đối với danh sách này, các bài được công bố trên trang công khai của giảng viên hoặc phòng thí nghiệm cũng được tính. Các bài này được thể hiện dưới dạng <span class="own">+N</span> sau số liệu chính thức và được xem là chưa chính thức cho đến khi hội nghị công bố."""
[home_note_coauthors]
other = """Các cột về đồng tác giả và lĩnh vực được tính trên toàn bộ các bài được thống kê, bao gồm cả bài bị từ chối.
* Số trung bình mỗi bài. "Nước ngoài" và "trong nước" chỉ đơn vị công tác ghi trên bài ở ngoài hay trong Việt Nam; "cùng trường" là trường của giảng viên, "đơn vị khác" là mọi đơn vị khác, trong nước hay nước ngoài.
Hai chỉ số này chỉ tính được với danh sách bài có ghi đơn vị công tác của tác giả; chỉ số lĩnh vực dựa trên nhãn chủ đề do hội nghị gán, chỉ có tại ICLR, NeurIPS và ICML từ năm 2023 hoặc 2024.
Trang của từng giảng viên có ghi rõ mỗi chỉ số được tính trên bao nhiêu bài."""
[home_overview]
other = "Được nhận và bị từ chối, tất cả giảng viên trong danh sách"
[home_overview_text]
other = """{{ .Accepted }} bài được chấp nhận tương ứng với khoảng {{ .Submissions }} lần nộp bài:
{{ .Recorded }} bài bị từ chối hoặc rút tại ICLR, nơi mọi bài nộp đều được công khai, và khoảng {{ .Estimated }} bài được ước tính cho các hội nghị còn lại."""
[home_fig1]
other = "Hình 1. Số bài được chấp nhận so với số bài bị từ chối (thống kê tại ICLR và ước tính tại các hội nghị khác), tính chung cho mọi năm và mọi hội nghị."
[home_fig2]
other = "Hình 2. Số liệu tương tự theo từng năm, dạng xếp chồng: phần dưới là bài được chấp nhận, phần giữa là bài bị từ chối tại ICLR (thống kê), phần trên là bài bị từ chối tại các hội nghị khác (ước tính)."
[home_fig2_provisional]
other = " * Danh sách chính thức của {{ . }} hiện chưa đầy đủ."
[home_numbers]
other = "Số liệu của hai hình"
[home_note_estimate]
other = """Trong tám hội nghị, chỉ ICLR công khai toàn bộ bài nộp cùng kết quả. Đối với NeurIPS, ICML, CVPR, ICCV, ECCV, ACL và EMNLP, số bài bị từ chối được ước tính dựa trên kết quả ICLR của từng giảng viên,
theo công thức: số lần nộp cho mỗi bài được chấp nhận = (số bài nộp ICLR + 1) / (số bài được nhận tại ICLR + 1). Với giảng viên chưa có bài nộp ICLR, không có phần ước tính bổ sung.
Một bài có hai giảng viên trong danh sách được tính cho cả hai người, tương tự như trên trang của từng giảng viên; một bài nộp nhiều hội nghị được tính theo từng lần nộp."""

