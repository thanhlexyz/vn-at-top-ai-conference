{{ .Recorded }} bài bị từ chối hoặc rút có ghi nhận (mọi bài nộp ICLR đều công khai; ở nơi khác là bài bị từ chối công khai tại NeurIPS và bài Findings), và khoảng {{ .Estimated }} bài được ước tính cho các hội nghị không công khai bài bị từ chối."""
