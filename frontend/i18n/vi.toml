# ---------------------------------------------------------------- front page
[home_title]
other = "Bài báo tại các hội nghị AI hàng đầu của giảng viên ở Việt Nam, {{ .First }}&ndash;{{ .Last }}"
[home_flag_incomplete]
other = "Một số hồ sơ hiện chưa đầy đủ hoặc đang chờ xác nhận. Các giảng viên này được đánh dấu * và trang của từng giảng viên có ghi rõ những thông tin còn thiếu."
[home_flag_pending]
other = "Hiện có {{ .Count }} trường hợp trùng tên chưa được xác nhận, xin xem tại trang <a href=\"{{ .URL }}\">Ứng viên</a>."
[home_note_table]
other = """<ul>
<li>Số bài bị từ chối gồm bài bị từ chối sau phản biện, bài rút và bài bị loại sơ bộ; số liệu theo từng hội nghị có ở trang của từng giảng viên và trang Giảng viên.</li>
<li>Tổng số bài bị từ chối gồm toàn bộ bài bị từ chối tại ICLR cộng với bài bị từ chối mà tác giả tự công khai ở hội nghị khác (một số bài tại NeurIPS), nên là con số tối thiểu.</li>
<li>Cột bị từ chối ước tính (màu cam), đã nộp ước tính (màu xám) và tỉ lệ được nhận ước tính (màu xanh, bằng số bài được nhận chia số bài đã nộp) là số liệu ước tính; xem trang <a href="{{ .About }}">Giới thiệu</a>.</li>
<li>Dấu &ndash; cho biết hồ sơ OpenReview của giảng viên chưa được thu thập.</li>
<li>Mọi số liệu chỉ tính nhánh chính (main track); không tính workshop, bài position và nhánh Datasets &amp; Benchmarks của NeurIPS.</li>
<li>Bài được xếp vào Findings là bài không được nhận vào nhánh chính, nên được tính là bị từ chối ở nhánh chính; bài này cũng được liệt kê cùng các bài workshop.</li>
<li>Giảng viên được sắp xếp theo tổng số bài được chấp nhận.</li>
</ul>"""
[home_note_provisional]
other = "Danh sách chính thức của {{ .Name }} {{ .Year }} chưa đầy đủ, nên các bài có trên trang của giảng viên cũng được tính; các bài này hiện dưới dạng <span class=\"own\">+N</span> và chưa chính thức cho đến khi hội nghị công bố."
[home_note_coauthors]
other = """<ul>
<li>Các cột về đồng tác giả và lĩnh vực được tính trên toàn bộ các bài được thống kê, kể cả bài bị từ chối.</li>
<li>* Số trung bình mỗi bài. "Nước ngoài" và "trong nước" chỉ đơn vị công tác ghi trên bài ở ngoài hay trong Việt Nam; "cùng trường" là trường của giảng viên, "đơn vị khác" là mọi đơn vị khác, trong nước hay nước ngoài.</li>
<li>Hai chỉ số này cần danh sách bài có ghi đơn vị công tác; số chủ đề dựa trên nhãn chủ đề do hội nghị gán, chỉ có tại ICLR, NeurIPS và ICML từ năm 2023 hoặc 2024.</li>
<li>Trang của từng giảng viên ghi rõ mỗi chỉ số được tính trên bao nhiêu bài.</li>
</ul>"""
[home_overview]
