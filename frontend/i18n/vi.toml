# ---------------------------------------------------------------- front page
[home_title]
other = "Bài báo tại các hội nghị AI hàng đầu của giảng viên ở Việt Nam, {{ .First }}&ndash;{{ .Last }}"
[home_flag_incomplete]
other = "Một số hồ sơ chưa đầy đủ hoặc còn chờ xác nhận. Những giảng viên đó được đánh dấu * và trang của họ ghi rõ còn thiếu gì."
[home_flag_pending]
other = "{{ .Count }} trường hợp khớp tên chưa chắc chắn đang chờ xác nhận, xem <a href=\"{{ .URL }}\">Ứng viên</a>."
[home_note_table]
other = """Cột bị từ chối của ICLR gồm bài bị từ chối, rút bài và bị loại sơ bộ.
Tổng bị từ chối cộng mọi bài bị từ chối ở ICLR với các bài bị từ chối mà tác giả tự công khai ở hội nghị khác (một số bài NeurIPS), nên đây là con số tối thiểu.
Tổng bị từ chối, ước tính (màu cam) cộng thêm phần ước tính cho các hội nghị không công khai bài bị từ chối, theo kết quả ICLR của chính giảng viên: số bài nộp cho mỗi bài được nhận = (số bài nộp ICLR + 1) / (số bài được nhận ở ICLR + 1). Đây là ước tính, không phải số đếm.
Dấu &ndash; nghĩa là chưa lấy được hồ sơ OpenReview của giảng viên đó.
Chỉ tính nhánh chính (main track); không tính workshop, Findings, bài position và nhánh Datasets &amp; Benchmarks của NeurIPS.
Giảng viên được xếp theo tổng số bài được nhận."""
[home_note_provisional]
other = """Danh sách chính thức {{ .Name }} {{ .Year }} được công bố trước hội nghị và chưa đầy đủ.
Riêng với danh sách này, bài được liệt kê trên trang cá nhân của giảng viên cũng được tính. Các bài đó hiện dưới dạng <span class="own">+N</span> sau con số chính thức và là chưa chính thức cho đến khi hội nghị công bố."""
[home_note_coauthors]
other = """Các cột đồng tác giả và lĩnh vực tính trên mọi bài được tính, kể cả bài bị từ chối.
Nước ngoài nghĩa là đơn vị ghi trên bài ở ngoài Việt Nam; đơn vị khác là số đồng tác giả khác nhau không cùng trường với giảng viên.
Cả hai cần danh sách bài có ghi đơn vị, còn lĩnh vực cần nhãn chủ đề của chính hội nghị, chỉ có ở ICLR, NeurIPS và ICML từ 2023 hoặc 2024.
Trang của từng giảng viên ghi rõ mỗi con số dựa trên bao nhiêu bài."""
[home_overview]
other = "Được nhận và bị từ chối, tất cả giảng viên trong danh sách"
[home_overview_text]
other = """{{ .Accepted }} bài được nhận ứng với khoảng {{ .Submissions }} lần nộp:
{{ .Recorded }} bài bị từ chối hoặc rút ở ICLR, nơi mọi bài nộp đều công khai, và khoảng {{ .Estimated }} bài nữa ước tính cho các hội nghị khác."""
[home_fig1]
other = "Hình 1. Bài được nhận so với bài bị từ chối, đếm được ở ICLR và ước tính ở nơi khác, cho mọi năm và hội nghị."
[home_fig2]
other = "Hình 2. Như trên theo từng năm, xếp chồng: được nhận ở dưới, bị từ chối ở ICLR (đếm được) ở giữa, bị từ chối ở nơi khác (ước tính) ở trên."
[home_fig2_provisional]
other = " * Danh sách chính thức {{ . }} chưa đầy đủ."
[home_numbers]
other = "Số liệu của hai hình"
[home_note_estimate]
other = """Chỉ ICLR công khai mọi bài nộp cùng kết quả. Với NeurIPS, ICML, CVPR và ACL, số bài bị từ chối được ước tính theo kết quả ICLR của chính từng giảng viên:
số bài nộp cho mỗi bài được nhận = (số bài nộp ICLR + 1) / (số bài được nhận ở ICLR + 1). Giảng viên chưa nộp ICLR thì không cộng thêm ước tính.
Một bài có hai giảng viên trong danh sách được tính cho cả hai, như trên trang của từng người, và một bài nộp nhiều hội nghị được tính mỗi lần nộp."""

