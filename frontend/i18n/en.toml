# ---------------------------------------------------------------- front page
[home_title]
other = "Conference papers by professors and lecturers in Vietnam, {{ .First }}&ndash;{{ .Last }}"
[home_flag_incomplete]
other = "Some records are incomplete or still to be confirmed. Those professors are marked with * and their pages say what is missing."
[home_flag_pending]
other = "{{ .Count }} uncertain matches wait for a decision, see <a href=\"{{ .URL }}\">Candidates</a>."
[home_note_table]
other = """Rejected counts rejected, withdrawn and desk-rejected submissions. The count per conference is on each professor's page and on the Professors page.
Total rejected adds every ICLR rejection to the rejections authors made public at other venues (some NeurIPS papers), so it is a lower bound.
Total rejected, estimated (orange) adds an estimate for the venues that hide their rejections, from each professor's own ICLR record: submissions per accepted paper = (ICLR submitted + 1) / (ICLR accepted + 1). It is an estimate, not a count.
&ndash; means the OpenReview records of that professor have not been fetched.
Main conference track only; workshops, position papers and the NeurIPS Datasets &amp; Benchmarks track are left out. A paper placed in Findings counts as rejected and as a workshop paper.
Professors are ordered by total accepted papers."""
[home_note_provisional]
other = """The official {{ .Name }} {{ .Year }} list was published before the conference and is not complete yet.
For that list only, papers that a professor's own page lists are counted as well. They are shown as <span class="own">+N</span> after the official number and are unofficial until the conference publishes them."""
[home_note_coauthors]
other = """The co-author and topic columns are taken over all counted papers, accepted or not.
* Averages per paper. Foreign and domestic mean the affiliation printed on the paper is outside or inside Vietnam; same institution is the professor's own institution, and other institutions is any other one, in Vietnam or abroad.
Both need a paper list with affiliations, and topic areas need the conference's own topic labels, which exist for ICLR, NeurIPS and ICML from 2023 or 2024 on.
Each professor's page says how many papers a figure is based on."""
[home_overview]
other = "Accepted and rejected, all listed professors"
[home_overview_text]
other = """{{ .Accepted }} accepted papers stand for about {{ .Submissions }} submissions:
{{ .Recorded }} rejected or withdrawn at ICLR, where every submission is public, and about {{ .Estimated }} more estimated for the other venues."""
[home_fig1]
other = "Fig. 1. Accepted papers against rejected papers, recorded at ICLR and estimated elsewhere, over all years and venues."
[home_fig2]
other = "Fig. 2. The same per year, stacked: accepted at the bottom, rejected at ICLR (recorded) above it, rejected elsewhere (estimated) on top."
[home_fig2_provisional]
other = " * The official {{ . }} list is not complete yet."
[home_numbers]
other = "The numbers behind the figures"
[home_note_estimate]
other = """Only ICLR publishes every submission with its outcome. For NeurIPS, ICML, CVPR, ICCV, ECCV, ACL and EMNLP the rejected papers are estimated from each professor's own ICLR record:
submissions per accepted paper = (ICLR submitted + 1) / (ICLR accepted + 1). A professor without ICLR submissions adds no estimate.
A paper of two listed professors is counted for each, as on their own pages, and a paper sent to several conferences counts once per submission."""

