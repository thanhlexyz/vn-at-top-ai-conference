# ---------------------------------------------------------------- front page
[home_title]
other = "Conference papers by professors and lecturers in Vietnam, {{ .First }}&ndash;{{ .Last }}"
[home_flag_incomplete]
other = "Some records are incomplete or still to be confirmed. Those professors are marked with * and their pages say what is missing."
[home_flag_pending]
other = "{{ .Count }} uncertain matches wait for a decision, see <a href=\"{{ .URL }}\">Candidates</a>."
[home_note_table]
other = """<ul>
<li>Rejected counts rejected, withdrawn and desk-rejected submissions; the count per conference is on each professor's page and on the Professors page.</li>
<li>Total rejected adds every ICLR rejection to the rejections authors made public at other venues (some NeurIPS papers), so it is a lower bound.</li>
<li>Rejected, estimated (orange), submitted, estimated (grey) and acceptance rate, estimated (blue, accepted divided by submitted) are estimates; see <a href="{{ .About }}">About</a>.</li>
<li>&ndash; means the OpenReview records of that professor have not been fetched.</li>
<li>All counts are for the main conference track only; workshops, position papers and the NeurIPS Datasets &amp; Benchmarks track are left out.</li>
<li>A paper placed in Findings was not accepted to the main track, so it counts as rejected from the main track; it is also listed with the workshop papers.</li>
<li>Professors are ordered by total accepted papers.</li>
</ul>"""
[home_note_provisional]
other = "The official {{ .Name }} {{ .Year }} list is not complete yet, so papers listed on professors' own pages count too; they are shown as <span class=\"own\">+N</span> and are unofficial until the conference publishes them."
[home_note_coauthors]
other = """<ul>
<li>The co-author and topic columns are taken over all counted papers, accepted or not.</li>
<li>* Averages per paper. Foreign and domestic mean the affiliation printed on the paper is outside or inside Vietnam; same institution is the professor's own institution, and other institutions is any other one, in Vietnam or abroad.</li>
<li>Both need a paper list with affiliations; topics need the conference's own topic labels, which exist for ICLR, NeurIPS and ICML from 2023 or 2024 on.</li>
<li>Each professor's page says how many papers a figure is based on.</li>
</ul>"""
[home_overview]
other = "Accepted and rejected, all listed professors"
[home_overview_text]
other = """{{ .Accepted }} accepted papers stand for about {{ .Submissions }} submissions:
{{ .Recorded }} rejected or withdrawn on record (every ICLR submission is public; elsewhere, public NeurIPS rejections and Findings papers), and about {{ .Estimated }} more estimated for the venues that hide their rejections."""
[home_fig1]
other = "Fig. 1a. Accepted papers against rejected papers, recorded and estimated, over all years and venues."
[home_fig2]
other = "Fig. 1b. The same per year."
[home_fig2_provisional]
other = " * The official {{ . }} list is not complete yet."
[home_numbers]
other = "The numbers behind the figures"
[home_note_estimate]
other = """How the rejected papers are estimated: see <a href="{{ .About }}">About</a>."""

