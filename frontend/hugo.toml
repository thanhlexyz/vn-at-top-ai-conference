baseURL = '/'
defaultContentLanguage = 'vi'
# Vietnamese at /, English at /en/
defaultContentLanguageInSubdir = false
title = 'Việt Nam tại các hội nghị AI hàng đầu'
disableKinds = ['taxonomy', 'term', 'rss']

[params]
  description = 'Papers of professors and lecturers in Vietnam at ten top AI conferences (AAAI, IJCAI, ICLR, NeurIPS, ICML, CVPR, ICCV, ECCV, ACL, EMNLP) since 2020, ranked by CSRankings score.'
  # Titles of rejected and withdrawn papers. Set to false to show the counts only.
  showNonAcceptedTitles = true
  # Share of sentences the AI-text detector flags, per paper (data/ai_scores.json, not committed), with its About
  # section. Off while the work is paused; set true to see it locally (publish.toml keeps it off).
  showAiScores = false
  # A local build asks search engines not to index it. publish.toml turns this off for the public site.
  local = true
  # GitHub repository (account/name) that the Feedback form opens an issue in
  repository = 'thanhlexyz/vn-at-top-ai-conference'


[languages]
  [languages.en]
    label = 'English'
    locale = 'en-us'
    weight = 2
    title = 'Vietnam at top AI conferences'
    [languages.en.params]
      description = 'Papers of professors and lecturers in Vietnam at ten top AI conferences (AAAI, IJCAI, ICLR, NeurIPS, ICML, CVPR, ICCV, ECCV, ACL, EMNLP) since 2020, ranked by CSRankings score.'
  [languages.vi]
    label = 'Tiếng Việt'
    locale = 'vi-vn'
    weight = 1
    title = 'Việt Nam tại các hội nghị AI hàng đầu'
    [languages.vi.params]
      description = 'Số bài của giảng viên tại Việt Nam ở mười hội nghị AI hàng đầu (AAAI, IJCAI, ICLR, NeurIPS, ICML, CVPR, ICCV, ECCV, ACL, EMNLP) từ năm 2020, xếp hạng theo điểm CSRankings.'

