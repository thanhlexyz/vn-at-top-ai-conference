baseURL = '/'
defaultContentLanguage = 'vi'
# Vietnamese at /, English at /en/
defaultContentLanguageInSubdir = false
title = 'Việt Nam tại các hội nghị AI hàng đầu'
disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

[params]
  description = 'Papers submitted, accepted and rejected at ICLR, NeurIPS, ICML, CVPR and ACL by professors and lecturers in Vietnam since 2020.'
  # Titles of rejected and withdrawn papers. Set to false to show the counts only.
  showNonAcceptedTitles = true
  # A local build asks search engines not to index it. publish.toml turns this off for the public site.
  local = true
  # GitHub repository (account/name) that the Feedback form opens an issue in
  repository = 'thanhlexyz/vn-at-top-ai-conference'


[languages]
  [languages.en]
    label = 'English'
    locale = 'en-us'
    weight = 2
    title = 'Vietnam at top AI conferences'
    [languages.en.params]
      description = 'Papers submitted, accepted and rejected at ICLR, NeurIPS, ICML, CVPR and ACL by professors and lecturers in Vietnam since 2020.'
  [languages.vi]
    label = 'Tiếng Việt'
    locale = 'vi-vn'
    weight = 1
    title = 'Việt Nam tại các hội nghị AI hàng đầu'
    [languages.vi.params]
      description = 'Số bài nộp, được nhận và bị từ chối ở ICLR, NeurIPS, ICML, CVPR và ACL của giảng viên tại Việt Nam từ năm 2020.'

