baseURL = '/'
defaultContentLanguage = 'vi'
defaultContentLanguageInSubdir = false
title = 'Vietnam AIRankings'
disableKinds = ['taxonomy', 'term', 'rss']

[params]
  description = 'Papers of professors and lecturers in Vietnam at thirteen top AI and robotics conferences (AAAI, IJCAI, ICLR, NeurIPS, ICML, CVPR, ICCV, ECCV, ACL, EMNLP, ICRA, IROS, RSS) since 2020, ranked by CSRankings score.'
  showNonAcceptedTitles = true
  showOtdScores = true
  local = true
  repository = 'thanhlexyz/vn-at-top-ai-conference'

[languages]
  [languages.en]
    label = 'English'
    locale = 'en-us'
    weight = 2
    title = 'Vietnam AIRankings'
    [languages.en.params]
      description = 'Papers of professors and lecturers in Vietnam at thirteen top AI and robotics conferences (AAAI, IJCAI, ICLR, NeurIPS, ICML, CVPR, ICCV, ECCV, ACL, EMNLP, ICRA, IROS, RSS) since 2020, ranked by CSRankings score.'
  [languages.vi]
    label = 'Tiếng Việt'
    locale = 'vi-vn'
    weight = 1
    title = 'Vietnam AIRankings'
    [languages.vi.params]
      description = 'Số bài của giảng viên tại Việt Nam ở mười ba hội nghị AI và robot hàng đầu (AAAI, IJCAI, ICLR, NeurIPS, ICML, CVPR, ICCV, ECCV, ACL, EMNLP, ICRA, IROS, RSS) từ năm 2020, xếp hạng theo điểm CSRankings.'

